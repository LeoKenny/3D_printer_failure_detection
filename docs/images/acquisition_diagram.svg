<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 260" role="img" aria-label="Acquisition pipeline: the ADXL345 sensor's FIFO is drained over SPI by the ESP32 acquisition stage, which queues packets and forwards them over a second SPI link to the Raspberry Pi storage stage, which writes them to the database.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- group frames -->
  <rect x="10" y="35" width="445" height="210" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="500" y="35" width="330" height="210" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="875" y="35" width="185" height="210" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- group labels -->
  <text x="25" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#c0272d">SENSOR</text>
  <text x="515" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#c0272d">ACQUISITION</text>
  <text x="890" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#c0272d">STORAGE</text>

  <!-- SENSOR boxes -->
  <rect x="30" y="75" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="80" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">ADC</text>

  <rect x="165" y="75" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="215" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">FIFO</text>

  <rect x="300" y="75" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">SPI slave</text>

  <rect x="30" y="175" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="80" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">Transducer</text>

  <rect x="300" y="175" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">Interrupt</text>

  <!-- ACQUISITION boxes -->
  <rect x="520" y="75" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">SPI master</text>

  <rect x="655" y="75" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="705" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">Queue</text>

  <rect x="520" y="175" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">GPIO</text>

  <rect x="655" y="175" width="100" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="705" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">SPI slave</text>

  <!-- STORAGE boxes -->
  <rect x="900" y="75" width="140" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="970" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">Database</text>

  <rect x="900" y="175" width="140" height="50" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="970" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1a">SPI master</text>

  <!-- within-group arrows -->
  <line x1="130" y1="100" x2="163" y2="100" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="265" y1="100" x2="298" y2="100" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="100" x2="653" y2="100" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="80" y1="175" x2="80" y2="127" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="215,125 215,150 350,150 350,173" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="570" y1="175" x2="570" y2="127" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="705" y1="125" x2="705" y2="173" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="970" y1="175" x2="970" y2="127" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- between-group bidirectional links -->
  <line x1="402" y1="100" x2="518" y2="100" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="402" y1="200" x2="518" y2="200" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="757" y1="200" x2="898" y2="200" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
